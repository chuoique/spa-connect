<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MND Citta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MND Citta">
<meta name="theme-color" content="#8a6d24">
<script>/* áp giao diện đã chọn ngay khi mở (không nháy màu) */
try { var t = localStorage.getItem('theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
/* Màu theo logo MND Citta: vàng ánh kim #a08235 (đậm hơn một chút cho chữ dễ đọc) */
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1f1b14; --muted:#6b6455; --line:#e4ddcd; --soft:#f3eee3;
  --brand:#8a6d24; --brand-fg:#ffffff; --brand-soft:#f4ecd8;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --info:#1d4ed8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#121110; --card:#1c1a17; --fg:#ece6da; --muted:#a69d8b; --line:#332e26; --soft:#25211b;
  --brand:#d4b465; --brand-fg:#1f1705; --brand-soft:#2e2615;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#7aa2ff; color-scheme:dark}}
/* Giao diện chọn trong Hệ thống -> Tài khoản (không chọn = theo máy sáng/tối) */
html[data-theme=light]{color-scheme:light}
html[data-theme=dark]{--bg:#121110; --card:#1c1a17; --fg:#ece6da; --muted:#a69d8b; --line:#332e26; --soft:#25211b;
  --brand:#d4b465; --brand-fg:#1f1705; --brand-soft:#2e2615; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#7aa2ff; color-scheme:dark}
html[data-theme=rose]{--bg:#fbf3f4; --card:#fff; --fg:#2a1a1d; --muted:#7a5f64; --line:#efd9dd; --soft:#f8e8eb;
  --brand:#b4506a; --brand-fg:#fff; --brand-soft:#f6dfe5; color-scheme:light}
html[data-theme=jade]{--bg:#f1f6f4; --card:#fff; --fg:#14231e; --muted:#55706a; --line:#d5e5df; --soft:#e5f0ec;
  --brand:#21806a; --brand-fg:#fff; --brand-soft:#d7ede6; color-scheme:light}
html[data-theme=ocean]{--bg:#f1f4f9; --card:#fff; --fg:#141c2b; --muted:#5a667c; --line:#d8e0ec; --soft:#e7edf6;
  --brand:#2557a7; --brand-fg:#fff; --brand-soft:#dce6f6; color-scheme:light}
html[data-theme=lavender]{--bg:#f6f3fa; --card:#fff; --fg:#211a2b; --muted:#6d6380; --line:#e3dbee; --soft:#efe9f6;
  --brand:#7650a8; --brand-fg:#fff; --brand-soft:#e9e0f5; color-scheme:light}
html[data-theme=night]{--bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --soft:#1f2630;
  --brand:#58a6ff; --brand-fg:#0d1117; --brand-soft:#1b2a40; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#79c0ff; color-scheme:dark}
html[data-theme=contrast]{--bg:#fff; --card:#fff; --fg:#000; --muted:#333; --line:#000; --soft:#eee;
  --brand:#000; --brand-fg:#fff; --brand-soft:#ddd; --ok:#006400; --warn:#7a4a00; --bad:#a00000; --info:#0033aa; color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:12px max(14px,env(safe-area-inset-right)) 16px max(14px,env(safe-area-inset-left));display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:var(--brand-fg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.big{font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
/* đầu trang */
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
header.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.spa{font-weight:700}
.who{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:99px;background:var(--soft);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.lan{background:var(--ok)} .dot.p2p{background:var(--info)} .dot.channel{background:var(--warn)} .dot.none{background:var(--bad)}
/* thanh chọn dưới */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:64px;border:0;background:none;padding:8px 6px;border-radius:9px;font-size:12px;color:var(--muted);display:grid;gap:2px;justify-items:center;cursor:pointer}
nav.tabs button .ic{font-size:18px;line-height:1}
nav.tabs button.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
/* danh sách */
.list{display:grid;gap:0;margin:0 -14px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--soft)}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:13px;color:var(--muted);grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{grid-row:span 2;text-align:right;font-size:13px}
.item .l{grid-row:span 2;font:600 14px var(--mono);color:var(--brand);min-width:44px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.requested{background:#fef3c7;color:#92400e} .chip.booked{background:var(--brand-soft);color:var(--brand)}
.chip.arrived,.chip.in_service{background:#dbeafe;color:#1e40af} .chip.done{background:#dcfce7;color:#166534}
.chip.cancelled,.chip.no_show,.chip.void{background:#fee2e2;color:#991b1b}
@media (prefers-color-scheme:dark){html:not([data-theme]) .chip.requested{background:#3b2a06;color:#fbbf24}html:not([data-theme]) .chip.arrived,html:not([data-theme]) .chip.in_service{background:#172554;color:#93c5fd}html:not([data-theme]) .chip.done{background:#052e16;color:#86efac}html:not([data-theme]) .chip.cancelled,html:not([data-theme]) .chip.no_show,html:not([data-theme]) .chip.void{background:#3b0d0d;color:#fca5a5}}
html[data-theme=dark] .chip.requested,html[data-theme=night] .chip.requested{background:#3b2a06;color:#fbbf24}
html[data-theme=dark] .chip.arrived,html[data-theme=dark] .chip.in_service,html[data-theme=night] .chip.arrived,html[data-theme=night] .chip.in_service{background:#172554;color:#93c5fd}
html[data-theme=dark] .chip.done,html[data-theme=night] .chip.done{background:#052e16;color:#86efac}
html[data-theme=dark] .chip.cancelled,html[data-theme=dark] .chip.no_show,html[data-theme=dark] .chip.void,html[data-theme=night] .chip.cancelled,html[data-theme=night] .chip.no_show,html[data-theme=night] .chip.void{background:#3b0d0d;color:#fca5a5}
.empty{padding:18px 4px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.signboard{display:block;width:100%;height:auto;margin:4px 0 12px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.bizhead{text-align:center;padding-bottom:8px;border-bottom:1px dashed var(--line,#8884)}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
/* bảng tạm (sheet) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:12px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet .bar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.x{border:0;background:var(--soft);border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 12px;font-size:13px}
@media (prefers-color-scheme:dark){html:not([data-theme]) .banner{background:#3b2a06;color:#fbbf24}}
html[data-theme=dark] .banner,html[data-theme=night] .banner{background:#3b2a06;color:#fbbf24}
pre.log{margin:0;font:11px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;color:var(--muted)}
.center{min-height:70vh;display:grid;place-items:center}
.center .card{width:100%;max-width:420px}
.pick{display:grid;gap:4px;max-height:220px;overflow:auto}
.pick button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;cursor:pointer}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:1fr 64px 110px auto;gap:6px;align-items:center}
@media (max-width:480px){.line{grid-template-columns:1fr 54px 92px auto}}
.total{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.combo{position:relative;display:grid}
.combo .pick{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.15);margin-top:2px}
.combo .pick[hidden]{display:none}
.hbtn{border:0;background:var(--soft);border-radius:99px;width:34px;height:34px;cursor:pointer;font-size:16px;flex:none}
.qr{display:grid;justify-items:center;gap:6px;text-align:center}
.qr img{width:180px;height:180px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:10px}
.grp{font-size:12px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
/* thẻ thành viên để in */
.membercard{width:85.6mm;height:54mm;border-radius:4mm;padding:4mm 5mm;background:linear-gradient(135deg,#1f1a12,#3b2f19);color:#e9d6a0;
  display:grid;grid-template-columns:1fr auto;gap:2mm;align-items:center;box-sizing:border-box;margin:0 auto}
.membercard .logo{width:30mm;height:auto;background:none;padding:0;image-rendering:auto}
.membercard .n{font-size:4.6mm;font-weight:700;color:#f5e7bf} .membercard .c{font:600 3.4mm var(--mono);letter-spacing:.06em}
.brandlogo{display:block;width:min(220px,70%);height:auto;margin:0 auto 4px}
@media (prefers-color-scheme:light){.brandlogo{filter:none}}
/* logo MND cao bằng dải đầu trang (chữ vàng nền trong suốt) */
.hlogo{height:46px;width:auto;flex:none;object-fit:contain;margin:-4px 0}
header.top .spa,header.top .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.hlogo{height:34px;margin:0}header.top .in{gap:6px}.flag img{width:22px;height:14px}
  #cbadge{font-size:0;gap:0;padding:6px}#cbadge .dot{width:10px;height:10px}}
@media (max-width:400px){.hlogo{height:28px}.hbtn{width:30px;height:30px;font-size:14px}}
.flags{display:flex;gap:4px;flex:none}
.flag{border:2px solid transparent;background:none;padding:1px;border-radius:5px;cursor:pointer;line-height:0;opacity:.55}
.flag img{width:26px;height:17px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.flag.on{opacity:1;border-color:var(--brand)}
/* biểu tượng khách: mờ = chưa có tài khoản app, sáng (vòng màu thương hiệu) = đã có */
.cav{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--muted);opacity:.35}
.cav.app{color:var(--brand);opacity:1;background:var(--brand-soft);box-shadow:0 0 0 2px var(--brand),0 0 12px var(--brand)}
/* nút chọn liền khối: [Nhân sự][Khách hàng][+ Thêm tài khoản] */
.seg{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--brand);min-width:0}
.seg button{border:0;background:var(--card);color:var(--brand);font-weight:600;padding:10px 12px;cursor:pointer;flex:1 1 0;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button+button{border-left:1px solid var(--brand)}
.seg button.on{background:var(--brand-soft)}
.seg button.add{background:var(--brand);color:var(--brand-fg);flex:1.4 1 0}
.seg .n{font-size:11px;font-weight:600;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 7px}
@media (max-width:420px){.seg button{padding:10px 6px;font-size:13px}.seg .n{display:none}}
details.card>summary{cursor:pointer;font-weight:700;font-size:17px;list-style:revert}
.membercard img{width:30mm;height:30mm;background:#fff;padding:1.5mm;border-radius:2mm;image-rendering:pixelated}
@media print{
  body *{visibility:hidden} .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%} .scrim{background:none}
  .membercard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="lib/forge.min.js"></script>
<script src="lib/mqtt.min.js"></script>
<script src="lib/nostr.bundle.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="js/i18n.js"></script>
<script src="js/conn.js"></script>
<script src="js/app.js"></script>
</body>
</html>
