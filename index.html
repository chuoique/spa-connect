<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kết nối spa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spa">
<meta name="theme-color" content="#0f766e">
<style>
:root{
  --bg:#eef1f4; --card:#ffffff; --fg:#161b22; --muted:#5b6573; --line:#d5dbe3;
  --accent:#1d4ed8; --accent-fg:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; --sel:#eef4ff;
  --p2p:#15803d; --mqtt:#b45309;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --card:#171b22; --fg:#e6e9ee; --muted:#98a2b0; --line:#2a313b;
  --accent:#7aa2ff; --accent-fg:#0b1530; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --sel:#1a2333;
  --p2p:#4ade80; --mqtt:#fbbf24; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:grid;gap:14px}
h1{font-size:21px;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
label{font-size:13px;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{font:600 20px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1 1 160px;min-width:0}
input.msg{font:15px var(--sans);letter-spacing:0;text-transform:none}
button{font:600 15px var(--sans);padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button.small{font-size:13px;padding:6px 10px}
.status{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.status.ok{color:var(--ok)} .status.bad{color:var(--warn)}
.now{display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 12px;border-left:5px solid var(--line);padding:4px 0 4px 12px}
.now.p2p{border-color:var(--p2p)} .now.mqtt{border-color:var(--mqtt)}
.now .path{font:700 19px var(--sans)}
.now .rtt{font:700 28px var(--mono);font-variant-numeric:tabular-nums;grid-row:span 2;text-align:right}
.now .detail{font:12px var(--mono);color:var(--muted);word-break:break-all}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.links li{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;
  border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.links li.active{border-color:var(--ok);background:var(--sel)}
.links li.sep{border:0;padding:4px 2px 0;font-size:12px;color:var(--muted);letter-spacing:.05em;display:block}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);grid-row:span 2}
.dot.up{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.down{background:var(--bad)}
.lname{font-weight:600}
.lname small{font-weight:700;color:var(--ok);letter-spacing:.06em;margin-left:6px;font-size:11px}
.lstate{font-size:13px;color:var(--muted);grid-column:2;word-break:break-all}
.lrtt{font:600 15px var(--mono);font-variant-numeric:tabular-nums;grid-row:span 2;text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);font-size:13px;word-break:break-all}
pre{margin:0;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;color:var(--muted)}
.chat{display:grid;gap:4px;font-size:14px}
</style>
</head>
<body>
<main>
  <div>
    <h1>Kết nối tới máy chủ spa</h1>
    <p class="sub">Nối qua MQTT trước cho chắc, rồi thử đường trực tiếp P2P cho nhanh. Đường nào hỏng thì tự chuyển. <span id="ver"></span></p>
  </div>

  <section class="card">
    <label for="code">Mã ghép đôi (hiện trên PC)</label>
    <div class="row">
      <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="9">
      <button id="go">Kết nối</button>
      <button id="stop" class="ghost" disabled>Ngắt</button>
    </div>
    <p class="status" id="status">Chưa kết nối</p>
    <div class="now" id="now">
      <span class="path" id="nowPath">–</span>
      <span class="rtt" id="nowRtt">–</span>
      <span class="detail" id="nowDetail">Đường đang dùng</span>
    </div>
  </section>

  <section class="card">
    <ul class="links" id="links"></ul>
    <div class="row">
      <button id="cutP2P" class="ghost small" disabled>Thử cắt P2P</button>
      <button id="kill" class="ghost small" disabled>Thử làm hỏng máy MQTT đang dùng</button>
      <button id="revive" class="ghost small" disabled>Bật lại máy MQTT</button>
    </div>
    <dl class="kv">
      <dt>Thông qua MQTT sau</dt><dd id="tMqtt">–</dd>
      <dt>P2P mở sau</dt><dd id="tP2P">–</dd>
      <dt>Số thứ tự</dt><dd id="num">–</dd>
      <dt>Số lần đổi đường</dt><dd id="switches">0</dd>
    </dl>
  </section>

  <section class="card">
    <div class="row">
      <input class="msg" id="msg" placeholder="Gửi tin nhắn tới PC" autocomplete="off">
      <button id="send" class="ghost" disabled>Gửi</button>
    </div>
    <div class="chat" id="chat"></div>
  </section>

  <section class="card">
    <label>Nhật ký kỹ thuật</label>
    <pre id="log"></pre>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
const V4ONLY = /[?&#]v4\b/.test(location.search + location.hash);
const VERSION = 'h3' + (V4ONLY ? ' (P2P CHỈ IPv4)' : '');
const SALT = 'spa-p2p-v1', ITERS = 100000;
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
// Phải khớp g_br[] trong hybrid_server.c
const LIST = [
  { name: 'emqx',      url: 'wss://broker.emqx.io:8084/mqtt' },
  { name: 'hivemq',    url: 'wss://broker.hivemq.com:8884/mqtt' },
  { name: 'mosquitto', url: 'wss://test.mosquitto.org:8081/mqtt' },
  { name: 'eclipse',   url: 'wss://mqtt.eclipseprojects.io:443/mqtt' },
];
const DEAD_MS = 7000;          // một đường im lặng lâu hơn -> coi như hỏng
const PROBE_MS = 10000;        // đường dự phòng: thăm dò mỗi 10 giây
const P2P_TIMEOUT = 20000;     // một lần thử P2P tối đa 20 giây
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const SUBTLE = !!(window.crypto && crypto.subtle);
const DEV = 'd' + Math.random().toString(36).slice(2, 10);

let key, base, brokers = [], active = null, seq = 0, sent = {}, seen = new Set(), seenQ = [];
let tStart = 0, switches = 0, tick = null, running = false, killed = null, lastPath = null, statsSent = false;
const p2p = { pc: null, dc: null, state: 'off', sid: '', lastPong: 0, lastPing: 0, rtts: [], retryAt: 0, delay: 5000,
              timer: null, pair: '', note: 'chưa thử', opened: 0, tries: 0 };

$('ver').textContent = `Phiên bản ${VERSION} · mã hóa ${SUBTLE ? 'WebCrypto' : 'forge'}`;

function log(s) {
  const t = new Date().toTimeString().slice(0, 8);
  const lines = ($('log').textContent + `[${t}] ${s}\n`).split('\n');
  $('log').textContent = lines.slice(-250).join('\n');
  $('log').scrollTop = $('log').scrollHeight;
}
function status(s, cls = '') { $('status').textContent = s; $('status').className = 'status ' + cls; }
function chat(s) { const d = document.createElement('div'); d.textContent = s; $('chat').prepend(d); }
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
const since = () => Math.round(performance.now() - tStart) + ' ms';

// Chế độ thử: bỏ mọi địa chỉ IPv6, .local và dải Tailscale -> P2P chỉ còn IPv4 công khai
function onlyV4(sdp) {
  if (!V4ONLY) return sdp;
  return sdp.split(/\r?\n/).filter(l => {
    if (!l.startsWith('a=candidate:')) return true;
    const addr = l.split(' ')[4] || '';
    const m = addr.match(/^100\.(\d+)\./);
    if (m && +m[1] >= 64 && +m[1] <= 127) return false;
    return !addr.includes(':') && !addr.endsWith('.local');
  }).join('\r\n');
}

// ---------- mã hóa (giống hybrid_server.c) ----------
const u8ToBin = u8 => { let s = ''; for (const b of u8) s += String.fromCharCode(b); return s; };
let derivedFor = null;
async function derive(code) {
  const norm = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (derivedFor === norm && key) return;
  if (!SUBTLE) {
    if (!window.forge) throw new Error('Chưa tải được thư viện mã hóa (forge).');
    try {   // forge trên iPhone mất ~11 giây -> tính một lần rồi nhớ trong máy này
      const c = JSON.parse(localStorage.getItem('spa-kc') || 'null');
      if (c && c.n === norm) { key = forge.util.hexToBytes(c.k); base = c.b; derivedFor = norm; log('Dùng khóa đã nhớ'); return; }
    } catch {}
    key = forge.pkcs5.pbkdf2(norm, SALT, ITERS, 32, forge.md.sha256.create());
    base = 'spa/' + forge.md.sha256.create().update('spa-p2p-topic:' + norm, 'utf8').digest().toHex().slice(0, 20);
    try { localStorage.setItem('spa-kc', JSON.stringify({ n: norm, k: forge.util.bytesToHex(key), b: base })); } catch {}
  } else {
    const b = await crypto.subtle.importKey('raw', enc.encode(norm), 'PBKDF2', false, ['deriveKey']);
    key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode(SALT), iterations: ITERS, hash: 'SHA-256' },
      b, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode('spa-p2p-topic:' + norm)));
    base = 'spa/' + [...h.slice(0, 10)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  derivedFor = norm;
}
async function seal(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const txt = JSON.stringify(obj);
  if (!SUBTLE) {
    const c = forge.cipher.createCipher('AES-GCM', key);
    c.start({ iv: u8ToBin(iv) });
    c.update(forge.util.createBuffer(forge.util.encodeUtf8(txt)));
    c.finish();
    return btoa(u8ToBin(iv) + c.output.getBytes() + c.mode.tag.getBytes());
  }
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(txt)));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return btoa(u8ToBin(out));
}
async function open(s) {
  try {
    const raw = atob(s);
    if (!SUBTLE) {
      const d = forge.cipher.createDecipher('AES-GCM', key);
      d.start({ iv: raw.slice(0, 12), tag: forge.util.createBuffer(raw.slice(-16)) });
      d.update(forge.util.createBuffer(raw.slice(12, -16)));
      if (!d.finish()) return null;
      return JSON.parse(forge.util.decodeUtf8(d.output.getBytes()));
    }
    const u = Uint8Array.from(raw, c => c.charCodeAt(0));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12));
    return JSON.parse(dec.decode(pt));
  } catch { return null; }
}

// ---------- gửi ----------
const p2pOpen = () => p2p.state === 'open' && p2p.dc && p2p.dc.readyState === 'open';
async function sendVia(b, obj, qos = 1) {
  if (!b || !b.client || !b.up) return false;
  obj.dev = DEV; obj.t = Date.now();
  b.client.publish(base + '/dev', await seal(obj), { qos });
  return true;
}
function sendP2P(obj) {
  if (!p2pOpen()) return false;
  obj.dev = DEV; obj.t = Date.now();
  try { p2p.dc.send(JSON.stringify(obj)); return true; } catch { return false; }
}
// Gửi bằng đường tốt nhất hiện có
async function send(obj) { return sendP2P(obj) || sendVia(active, obj); }

// ---------- hiển thị ----------
function render() {
  const path = p2pOpen() ? 'p2p' : active ? 'mqtt' : null;
  if (path !== lastPath) {
    if (lastPath && path) { switches++; $('switches').textContent = switches; }
    if (lastPath && path) chat(path === 'p2p' ? '⇄ Chuyển sang P2P trực tiếp' : `⇄ Quay về MQTT (${active.name})`);
    lastPath = path;
  }
  $('now').className = 'now ' + (path || '');
  $('nowPath').textContent = path === 'p2p' ? 'P2P trực tiếp' : path === 'mqtt' ? `MQTT qua ${active.name}` : '–';
  const r = path === 'p2p' ? median(p2p.rtts) : path === 'mqtt' ? median(active.rtts) : null;
  $('nowRtt').textContent = r != null ? r + ' ms' : '–';
  $('nowDetail').textContent = path === 'p2p' ? p2p.pair : path === 'mqtt' ? 'qua máy chuyển tiếp công cộng, đã mã hóa' : 'Đường đang dùng';
  $('send').disabled = !path;

  const ul = $('links'); ul.innerHTML = '';
  const row = (name, on, dotCls, state, rtt) => {
    const li = document.createElement('li'); if (on) li.className = 'active';
    const dot = document.createElement('span'); dot.className = 'dot ' + dotCls;
    const nm = document.createElement('span'); nm.className = 'lname'; nm.textContent = name;
    if (on) { const s = document.createElement('small'); s.textContent = 'ĐANG DÙNG'; nm.append(s); }
    const rt = document.createElement('span'); rt.className = 'lrtt'; rt.textContent = rtt != null ? rtt + ' ms' : '–';
    const st = document.createElement('span'); st.className = 'lstate'; st.textContent = state;
    li.append(dot, nm, rt, st); ul.append(li);
  };
  const sep = t => { const li = document.createElement('li'); li.className = 'sep'; li.textContent = t; ul.append(li); };
  sep('ĐƯỜNG TRỰC TIẾP');
  row('P2P', path === 'p2p', p2p.state === 'open' ? 'ok' : p2p.state === 'trying' ? 'up' : p2p.state === 'failed' ? 'down' : '',
      p2p.note, median(p2p.rtts));
  sep('MÁY CHUYỂN TIẾP MQTT');
  for (const b of brokers)
    row(b.name, path === 'mqtt' && b === active, b.welcomed && b.up ? 'ok' : b.up ? 'up' : b.failed ? 'down' : '', b.state, median(b.rtts));
  $('cutP2P').disabled = !p2pOpen();
  $('kill').disabled = !active || !!killed;
  $('revive').disabled = !killed;
}

// ---------- MQTT ----------
function setActive(b, why) {
  if (b === active) return;
  const old = active; active = b;
  log(old ? `MQTT đổi máy: ${old.name} → ${b.name} (${why})` : `MQTT dùng ${b.name} (${why})`);
  render();
}
function pickBest(except) {
  const now = performance.now();
  const ok = brokers.filter(b => b !== except && b.up && b.welcomed && now - b.lastPong < PROBE_MS * 2 + 2000);
  ok.sort((x, y) => (median(x.rtts) ?? 1e9) - (median(y.rtts) ?? 1e9));
  return ok[0] || brokers.find(b => b !== except && b.up && b.welcomed) || null;
}
function failover(why) {
  const next = pickBest(active);
  if (next) setActive(next, why);
  else { active = null; render(); if (!p2pOpen()) status('Mất kết nối với mọi máy MQTT, đang thử lại…', 'bad'); }
}

function makeBroker(def) {
  const b = { ...def, client: null, up: false, welcomed: false, failed: false, rtts: [], lastPong: 0, lastProbe: 0, lastPing: 0, tConn: 0, state: 'đang nối…' };
  const tc = performance.now();
  b.client = mqtt.connect(def.url, { clientId: 'spa-' + DEV + '-' + def.name, clean: true, keepalive: 20, reconnectPeriod: 3000, connectTimeout: 10000 });
  b.client.on('connect', async () => {
    b.up = true; b.failed = false;
    if (!b.tConn) { b.tConn = Math.round(performance.now() - tc); log(`[${b.name}] nối được sau ${b.tConn} ms`); }
    else log(`[${b.name}] nối lại được`);
    b.state = `nối ${b.tConn} ms · chờ PC chào`;
    b.client.subscribe([base + '/pc', base + '/status'], { qos: 1 });
    b.helloAt = b.lastProbe = performance.now();
    await sendVia(b, { type: 'hello' });
    render();
  });
  b.client.on('close', () => {
    if (b.up) log(`[${b.name}] mất kết nối`);
    b.up = false; b.welcomed = false;
    b.state = b === killed ? 'đã tắt thử' : 'mất kết nối, đang thử lại…';
    if (b === active) failover('máy đang dùng mất kết nối'); else render();
  });
  b.client.on('error', e => { b.failed = true; b.state = 'lỗi: ' + ((e && e.message) || '?'); render(); });
  b.client.on('offline', () => { b.failed = true; if (!b.up) b.state = 'không nối được, đang thử lại…'; render(); });
  b.client.on('message', async (topic, payload) => { const m = await open(payload.toString()); if (m) onMsg(m, b); else log(`[${b.name}] tin không giải mã được`); });
  return b;
}

// ---------- P2P ----------
function waitGathering(pc, ms) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, ms);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}
async function readPair(pc) {
  const stats = await pc.getStats();
  let pair = null;
  stats.forEach(s => { if (s.type === 'transport' && s.selectedCandidatePairId) pair = stats.get(s.selectedCandidatePairId); });
  if (!pair) stats.forEach(s => { if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s; });
  if (!pair) return '';
  const fmt = c => { if (!c) return '?'; const a = c.address || c.ip || '?'; return (a.includes(':') ? `[${a}]` : a) + ':' + c.port; };
  const r = stats.get(pair.remoteCandidateId), l = stats.get(pair.localCandidateId);
  return `${(r && (r.address || r.ip) || '').includes(':') ? 'IPv6' : 'IPv4'} · iPhone ${fmt(l)} ⇄ PC ${fmt(r)}`;
}

async function startP2P() {
  if (!active || p2p.state === 'trying' || p2p.state === 'open') return;
  const myTry = ++p2p.tries;
  p2p.state = 'trying'; p2p.note = `đang thử (lần ${myTry})…`; render();
  const t0 = performance.now();
  p2p.sid = Math.random().toString(36).slice(2, 12);
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const dc = pc.createDataChannel('spa');
  p2p.pc = pc; p2p.dc = dc;
  clearTimeout(p2p.timer);
  p2p.timer = setTimeout(() => { if (p2p.pc === pc && p2p.state === 'trying') failP2P('hết 20 giây, đục lỗ không được'); }, P2P_TIMEOUT);
  dc.onopen = async () => {
    if (p2p.pc !== pc) return;
    clearTimeout(p2p.timer);
    p2p.state = 'open'; p2p.lastPong = performance.now(); p2p.delay = 5000; p2p.opened = performance.now();
    p2p.pair = await readPair(pc);
    p2p.note = p2p.pair || 'đã mở';
    if ($('tP2P').textContent === '–') $('tP2P').textContent = `${since()} (lần thử này ${Math.round(performance.now() - t0)} ms)`;
    log(`P2P MỞ sau ${Math.round(performance.now() - t0)} ms: ${p2p.pair}`);
    status('Đã thông với PC qua P2P trực tiếp', 'ok');
    render();
  };
  dc.onmessage = e => { try { onMsg(JSON.parse(e.data), 'p2p'); } catch {} };
  dc.onclose = () => { if (p2p.pc === pc) failP2P('kênh P2P đóng'); };
  pc.oniceconnectionstatechange = () => {
    if (p2p.pc !== pc) return;
    const s = pc.iceConnectionState;
    if (s === 'failed') failP2P('ICE thất bại');
    else if (s === 'disconnected') log('P2P: ICE tạm mất…');
  };
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await waitGathering(pc, 2500);
    if (p2p.pc !== pc) return;
    const sdp = onlyV4(pc.localDescription.sdp);
    const n = (sdp.match(/a=candidate:/g) || []).length;
    log(`P2P: gửi offer (${n} địa chỉ) qua MQTT ${active ? active.name : '?'}`);
    p2p.note = `đã gửi lời mời qua ${active ? active.name : '?'}, chờ PC…`; render();
    if (!(await sendVia(active, { type: 'offer', sid: p2p.sid, sdp }))) failP2P('không có máy MQTT để gửi lời mời');
  } catch (e) { failP2P('lỗi: ' + e.message); }
}
async function onAnswer(m) {
  if (m.sid !== p2p.sid || !p2p.pc || p2p.state !== 'trying') return;
  log('P2P: nhận answer từ PC, đang đục lỗ…');
  p2p.note = 'PC đã trả lời, đang đục lỗ…'; render();
  try { await p2p.pc.setRemoteDescription({ type: 'answer', sdp: onlyV4(m.sdp) }); }
  catch (e) { failP2P('answer lỗi: ' + e.message); }
}
function closePC() {
  clearTimeout(p2p.timer);
  const pc = p2p.pc; p2p.pc = null; p2p.dc = null;
  if (pc) { try { pc.close(); } catch {} }
}
function failP2P(why) {
  const wasOpen = p2p.state === 'open';
  closePC();
  p2p.state = 'failed';
  // giữ được lâu thì thử lại sớm; thất bại liên tiếp thì giãn dần (5 s → 2 phút)
  if (!wasOpen) p2p.delay = Math.min(p2p.delay * 2, 120000);
  p2p.retryAt = performance.now() + (wasOpen ? 3000 : p2p.delay);
  p2p.note = `${why} · thử lại sau ${Math.round((p2p.retryAt - performance.now()) / 1000)} s`;
  log(`P2P ${wasOpen ? 'RỚT' : 'không được'}: ${why} → dùng MQTT`);
  sendVia(active, { type: 'p2p_off', why });
  if (active) status(`Đang dùng MQTT qua ${active.name} (P2P: ${why})`, 'ok');
  render();
}

// ---------- nhận tin (từ MQTT hoặc P2P) ----------
async function onMsg(m, via) {
  const vname = via === 'p2p' ? 'P2P' : via.name;
  if (m.type === 'presence') { log(`[${vname}] PC ${m.online ? 'đang chạy' : 'đã tắt'}`); if (!m.online && via !== 'p2p') { via.welcomed = false; via.state = 'PC báo tắt'; render(); } return; }
  if (m.to && m.to !== DEV) return;
  if (m.not === DEV) return;
  if (via !== 'p2p' && m.t && Math.abs(Date.now() - m.t) > 60000) return;
  if (m.type === 'pong') {
    const p = sent[m.seq]; if (!p || p.via !== via) return;
    delete sent[m.seq];
    const r = Math.round(performance.now() - p.t);
    const arr = via === 'p2p' ? p2p.rtts : via.rtts;
    arr.push(r); if (arr.length > 20) arr.shift();
    if (via === 'p2p') { p2p.lastPong = performance.now(); if (p2p.rtts.length === 10 && !statsSent) { statsSent = true; sendStats(); } }
    else via.lastPong = performance.now();
    render();
    return;
  }
  if (m.mid) { if (seen.has(m.mid)) return; seen.add(m.mid); seenQ.push(m.mid); if (seenQ.length > 300) seen.delete(seenQ.shift()); }
  if (m.type === 'welcome' && via !== 'p2p') {
    const ms = Math.round(performance.now() - via.helloAt);
    via.welcomed = true; via.lastPong = performance.now();
    via.state = `nối ${via.tConn} ms · PC chào ${ms} ms`;
    $('num').textContent = '#' + m.num;
    if ($('tMqtt').textContent === '–') { $('tMqtt').textContent = `${since()} (qua ${via.name})`; status(`Đã thông với PC qua MQTT ${via.name}, đang thử P2P…`, 'ok'); }
    if (!active || !active.up || !active.welcomed) setActive(via, active ? 'máy cũ hỏng' : 'trả lời đầu tiên');
    if (p2p.state === 'off') { p2p.retryAt = 0; }
    render();
  } else if (m.type === 'answer') onAnswer(m);
  else if (m.type === 'p2p_welcome') {
    // Safari giấu địa chỉ IP trong getStats -> lấy theo PC báo về cho chính xác
    log(`PC xác nhận P2P: PC ${m.pcSide} ⇄ iPhone ${m.phoneSide}`);
    const ip = s => (s || '').replace(/^\w+ /, '').replace(/ \(\w+\)$/, '');
    p2p.pair = `${(m.pcSide || '').includes('[') ? 'IPv6' : 'IPv4'} · iPhone ${ip(m.phoneSide)} ⇄ PC ${ip(m.pcSide)}`;
    p2p.note = p2p.pair; render();
  }
  else if (m.type === 'text') chat(`${m.from} (qua ${vname}): ${m.text}`);
  else if (m.type === 'ack') chat(`PC: ${m.text}`);
}

function sendStats() {
  const bs = brokers.map(b => `${b.name} ${b.welcomed ? (median(b.rtts) ?? '?') + 'ms' : '✕'}`).join(', ');
  send({ type: 'stats', text: `[${VERSION}] MQTT thông ${$('tMqtt').textContent} · P2P mở ${$('tP2P').textContent} · khứ hồi P2P ${median(p2p.rtts)}ms · ${p2p.pair} · MQTT: ${bs}` });
}

// ---------- vòng lặp 0,5 giây ----------
function ping(via) {
  const n = ++seq; sent[n] = { t: performance.now(), via };
  if (via === 'p2p') sendP2P({ type: 'ping', seq: n });
  else sendVia(via, { type: 'ping', seq: n, active: via === active }, 0);
}
function loop() {
  if (!running || document.hidden) return;
  const now = performance.now();
  for (const k in sent) if (now - sent[k].t > 15000) delete sent[k];
  // P2P: ping mỗi 2 giây; im quá lâu thì bỏ, quay về MQTT
  if (p2pOpen()) {
    if (now - p2p.lastPing >= 2000) { p2p.lastPing = now; ping('p2p'); }
    if (now - p2p.lastPong > DEAD_MS) failP2P(`${Math.round((now - p2p.lastPong) / 1000)} giây không trả lời`);
  }
  // MQTT đang dùng: 2 giây/lần khi là đường chính, 10 giây/lần khi chỉ làm dự phòng cho P2P
  if (active && active.up) {
    const every = p2pOpen() ? PROBE_MS : 2000;
    if (now - active.lastPing >= every) { active.lastPing = now; ping(active); }
    if (active.lastPong && now - active.lastPong > (p2pOpen() ? PROBE_MS * 2 + 2000 : DEAD_MS)) {
      log(`[${active.name}] không trả lời`); active.welcomed = false; active.state = 'không trả lời'; failover('máy đang dùng không trả lời');
    }
  }
  for (const b of brokers) {
    if (b === active || !b.up || now - b.lastProbe < PROBE_MS) continue;
    b.lastProbe = now;
    if (!b.welcomed) { b.helloAt = now; sendVia(b, { type: 'hello' }); continue; }
    ping(b);
  }
  // Thử (lại) P2P khi đã có MQTT
  if (active && active.welcomed && (p2p.state === 'off' || p2p.state === 'failed') && now >= p2p.retryAt) startP2P();
  if (p2p.state === 'failed') {
    const s = Math.max(0, Math.round((p2p.retryAt - now) / 1000));
    p2p.note = p2p.note.replace(/thử lại sau \d+ s/, `thử lại sau ${s} s`);
  }
  render();
}

// ---------- nút ----------
async function connect() {
  if (!window.mqtt) { status('Chưa tải được thư viện MQTT. Kiểm tra mạng rồi tải lại trang.', 'bad'); return; }
  const code = $('code').value.trim();
  if (code.replace(/[^A-Za-z0-9]/g, '').length < 8) { status('Nhập đủ 8 ký tự mã ghép đôi.', 'bad'); return; }
  try { localStorage.setItem('spa-code', code); } catch {}   // nhớ mã: lần sau mở app tự kết nối
  teardown();
  $('go').disabled = true; $('stop').disabled = false;
  tStart = performance.now(); statsSent = false; $('tMqtt').textContent = '–'; $('tP2P').textContent = '–';
  status('Đang tạo khóa…');
  try { await derive(code); } catch (e) { status(e.message, 'bad'); $('go').disabled = false; return; }
  log(`Khóa xong sau ${since()}. Nối cùng lúc ${LIST.length} máy MQTT`);
  status(`Đang nối ${LIST.length} máy MQTT cùng lúc…`);
  running = true;
  Object.assign(p2p, { state: 'off', note: 'chờ MQTT thông', rtts: [], delay: 5000, retryAt: 0, tries: 0, pair: '' });
  brokers = LIST.map(makeBroker);
  tick = setInterval(loop, 500);
  render();
}
function teardown() {
  running = false; clearInterval(tick); closePC();
  for (const b of brokers) { try { b.client.end(true); } catch {} }
  brokers = []; active = null; killed = null; sent = {}; lastPath = null; p2p.state = 'off'; p2p.note = 'chưa thử';
  render();
}
$('go').onclick = connect;
$('stop').onclick = async () => { await send({ type: 'bye' }); teardown(); $('go').disabled = false; $('stop').disabled = true; status('Đã ngắt'); };
$('send').onclick = async () => {
  const v = $('msg').value.trim(); if (!v) return;
  $('msg').value = '';
  const via = p2pOpen() ? 'P2P' : active ? active.name : null;
  if (!via) { chat('(chưa có đường nào tới PC)'); return; }
  chat(`Tôi (qua ${via}): ${v}`);
  await send({ type: 'text', text: v });
};
$('msg').addEventListener('keydown', e => { if (e.key === 'Enter') $('send').click(); });
$('cutP2P').onclick = () => failP2P('bạn bấm thử cắt');
$('kill').onclick = () => { if (!active) return; killed = active; log(`Thử làm hỏng ${killed.name}`); killed.client.end(true); };
$('revive').onclick = () => {
  if (!killed) return;
  const i = brokers.indexOf(killed);
  if (i >= 0) brokers[i] = makeBroker(LIST.find(d => d.name === killed.name));
  log(`Bật lại ${killed.name}`); killed = null; render();
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden || !running) return;
  const now = performance.now();
  for (const b of brokers) if (b.up) { b.helloAt = now; sendVia(b, { type: 'hello' }); }
  if (active) active.lastPong = now;                         // tránh chuyển nhầm vì thời gian ngủ
  if (p2pOpen()) { p2p.lastPong = now; ping('p2p'); }         // còn sống thì sẽ có pong; không thì 7 s sau quay về MQTT
  else if (p2p.state === 'failed') p2p.retryAt = now + 1000;  // quay lại trang: thử P2P ngay
});
window.addEventListener('pagehide', () => send({ type: 'bye' }));

// Đã từng nhập mã -> điền sẵn và tự kết nối ngay khi mở
let saved = null;
try { saved = localStorage.getItem('spa-code') || (JSON.parse(localStorage.getItem('spa-kc') || 'null') || {}).n; } catch {}
if (saved) { $('code').value = saved; if (window.mqtt) setTimeout(connect, 0); }
// Bản sao trong máy (chỉ có khi trang chạy qua https)
if ('serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register('sw.js').catch(e => log('Không cài được bản lưu: ' + e.message));
window.addEventListener('error', e => log('Lỗi trang: ' + e.message));
render();
})();
</script>
</body>
</html>
